<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="ACP.css">
</head>

<body>
  <h1>Weather App</h1>

  <section class="weather-card">
    <div class="weather-icon"></div>
    <h2>Today</h2>
    <p class="temperature">28°C</p>
    <p class="condition">Sunny</p>
  </section>

  <section class="forecast">
    <h2>5-Day Forecast</h2>
    <div class="forecast-days">
      <div class="day"><h3>Mon</h3><p>Sunny</p><p>29°C</p></div>
      <div class="day"><h3>Tue</h3><p>Cloudy</p><p>26°C</p></div>
      <div class="day"><h3>Wed</h3><p>Rainy</p><p>23°C</p></div>
      <div class="day"><h3>Thu</h3><p>Windy</p><p>25°C</p></div>
      <div class="day"><h3>Fri</h3><p>Sunny</p><p>30°C</p></div>
    </div>
  </section>
</body>
</html>
